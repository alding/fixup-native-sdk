name: iOS SDK Build

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build FixupModule for iOS
        run: |
          xcodebuild \
            -scheme FixupModule \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/FixupModuleDerivedData" \
            build
